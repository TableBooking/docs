components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: CONFLICT
        message:
          type: string
          example: Trạng thái đặt bàn đã thay đổi
        correlationId: *id001
        details:
          type: object
          additionalProperties: true
      additionalProperties: false
      required:
      - code
      - message
      - correlationId
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
          minimum: 1
        limit:
          type: integer
          example: 20
          minimum: 1
        total:
          type: integer
          example: 1
          minimum: 0
        totalPages:
          type: integer
          example: 1
          minimum: 0
      additionalProperties: false
      required:
      - page
      - limit
      - total
      - totalPages
    User:
      type: object
      properties:
        id: *id001
        email:
          type: string
          example: guest@example.test
          format: email
        fullName:
          type: string
          example: Khách thử nghiệm
        phone:
          type: string
          example: 0900000000
        role:
          type: string
          example: CUSTOMER
          enum:
          - CUSTOMER
          - STAFF
          - MANAGER
        active:
          type: boolean
          example: true
        createdAt: &id002
          type: string
          example: '2026-11-10T11:30:00+07:00'
          format: date-time
      additionalProperties: false
      required:
      - id
      - email
      - fullName
      - role
      - active
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          example: guest@example.test
          format: email
        password:
          type: string
          example: StrongPass123!
          minLength: 8
        fullName:
          type: string
          example: Khách thử nghiệm
        phone:
          type: string
          example: 0900000000
      additionalProperties: false
      required:
      - email
      - password
      - fullName
    LoginInput:
      type: object
      properties:
        email:
          type: string
          example: guest@example.test
          format: email
        password:
          type: string
          example: StrongPass123!
          minLength: 8
      additionalProperties: false
      required:
      - email
      - password
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          example: mock-token-customer
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 900
        user:
          $ref: '#/components/schemas/User'
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
    UserPatch:
      type: object
      properties:
        fullName:
          type: string
          example: Nguyễn Văn B
        phone:
          type: string
          example: 0912345678
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        currentPassword:
          type: string
          example: StrongPass123!
        newPassword:
          type: string
          example: AnotherStrongPass123!
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
    StaffCreate:
      type: object
      properties:
        email:
          type: string
          example: staff@example.test
          format: email
        password:
          type: string
          example: StrongPass123!
        fullName:
          type: string
          example: Lễ tân mẫu
      additionalProperties: false
      required:
      - email
      - password
      - fullName
    AccountStatusInput:
      type: object
      properties:
        active:
          type: boolean
          example: false
      additionalProperties: false
      required:
      - active
    Restaurant:
      type: object
      properties:
        id:
          type: string
          example: rest-001
        name:
          type: string
          example: Nhà hàng Demo
        timezone:
          type: string
          example: Asia/Ho_Chi_Minh
        address:
          type: string
          example: Đà Nẵng
        phone:
          type: string
          example: '0236000000'
        cancelBeforeMinutes:
          type: integer
          example: 120
        noShowAfterMinutes:
          type: integer
          example: 15
        checkinEarlyMinutes:
          type: integer
          example: 30
      additionalProperties: false
      required:
      - id
      - name
      - timezone
    Area:
      type: object
      properties:
        id:
          type: string
          example: main
        name:
          type: string
          example: Sảnh chính
        active:
          type: boolean
          example: true
      additionalProperties: false
      required:
      - id
      - name
      - active
    AreaInput:
      type: object
      properties:
        id:
          type: string
          example: terrace
        name:
          type: string
          example: Sân vườn
        active:
          type: boolean
          example: true
      additionalProperties: false
      required:
      - id
      - name
    Table:
      type: object
      properties:
        id:
          type: string
          example: T02
        areaId:
          type: string
          example: main
        name:
          type: string
          example: Bàn số 2
        capacity:
          type: integer
          example: 4
          minimum: 1
        active:
          type: boolean
          example: true
      additionalProperties: false
      required:
      - id
      - areaId
      - capacity
      - active
    TableInput:
      type: object
      properties:
        id:
          type: string
          example: T05
        areaId:
          type: string
          example: main
        name:
          type: string
          example: Bàn số 5
        capacity:
          type: integer
          example: 4
          minimum: 1
      additionalProperties: false
      required:
      - id
      - areaId
      - capacity
    TablePatch:
      type: object
      properties:
        areaId:
          type: string
          example: terrace
        name:
          type: string
          example: Bàn cạnh cửa sổ
        capacity:
          type: integer
          example: 6
          minimum: 1
        active:
          type: boolean
          example: true
      additionalProperties: false
    Slot:
      type: object
      properties:
        code:
          type: string
          example: dinner
        date: &id003
          type: string
          example: '2026-11-10'
          format: date
        startsAt: *id002
        endsAt:
          type: string
          example: '2026-11-10T19:30:00+07:00'
          format: date-time
        bookingOpen:
          type: boolean
          example: true
      additionalProperties: false
      required:
      - code
      - date
      - startsAt
      - endsAt
      - bookingOpen
    SlotConfigInput:
      type: object
      properties:
        code:
          type: string
          example: lunch
        startsAtLocal:
          type: string
          example: '11:30'
        endsAtLocal:
          type: string
          example: '13:00'
        active:
          type: boolean
          example: true
      additionalProperties: false
      required:
      - code
      - startsAtLocal
      - endsAtLocal
    Availability:
      type: object
      properties:
        date: *id003
        slotCode:
          type: string
          example: dinner
        partySize:
          type: integer
          example: 4
          minimum: 1
        available:
          type: boolean
          example: true
        availableTableCount:
          type: integer
          example: 3
          minimum: 0
        note:
          type: string
          example: Tham khảo, không giữ bàn
      additionalProperties: false
      required:
      - date
      - slotCode
      - partySize
      - available
      - availableTableCount
    BookingInput:
      type: object
      properties:
        slotId:
          type: string
          example: 2026-11-10-dinner
          pattern: ^\d{4}-\d{2}-\d{2}-(lunch|dinner)$
        partySize:
          type: integer
          example: 4
          minimum: 1
          maximum: 12
        note:
          type: string
          example: Gần cửa sổ
        contactPhone:
          type: string
          example: 0900000000
      additionalProperties: false
      required:
      - slotId
      - partySize
    BookingReceipt:
      type: object
      properties:
        bookingId: *id001
        processingStatus:
          type: string
          example: QUEUED
          enum:
          - QUEUED
        createdAt: *id002
      additionalProperties: false
      required:
      - bookingId
      - processingStatus
    Booking:
      type: object
      properties:
        bookingId: *id001
        customerId: *id001
        slotId:
          type: string
          example: 2026-11-10-dinner
        partySize:
          type: integer
          example: 4
          minimum: 1
        note:
          type: string
          example: Gần cửa sổ
        state:
          type: string
          example: REQUESTED
          enum: &id004
          - REQUESTED
          - CONFIRMED
          - REJECTED
