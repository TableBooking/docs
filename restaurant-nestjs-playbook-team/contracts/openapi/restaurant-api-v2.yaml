openapi: 3.0.3
info:
  title: Restaurant Reservation Platform — Contract V2
  version: 2.0.0
  description: Thiết kế contract-first cho NestJS Hướng 2. `x-implementation` phân biệt existing/planned/adapt; server
    mock là mô phỏng, không đại diện RabbitMQ thật.
servers:
- url: http://localhost:4010
  description: Stateful mock HTTP local
- url: http://localhost:8080
  description: NestJS gateway (chỉ hỗ trợ endpoint đã implement)
tags:
- name: Auth
- name: Booking
- name: Operations
- name: Tracking
- name: Notification
- name: Gateway
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      summary: Khách đăng ký tài khoản
      operationId: auth_1_post
      x-implementation: existing
      x-roles: PUBLIC
      responses:
        '201':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Đăng nhập lấy access token và refresh cookie
      operationId: auth_2_post
      x-implementation: existing
      x-roles: PUBLIC
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
  /api/auth/refresh:
    post:
      tags:
      - Auth
      summary: Xoay vòng refresh session
      operationId: auth_3_post
      x-implementation: existing
      x-roles: PUBLIC
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: Thu hồi refresh session
      operationId: auth_4_post
      x-implementation: existing
      x-roles: PUBLIC
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/auth/change-password:
    post:
      tags:
      - Auth
      summary: Đổi mật khẩu khi đã đăng nhập
      operationId: auth_5_post
      x-implementation: planned
      x-roles: CUSTOMER|STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
  /api/users/me:
    get:
      tags:
      - Auth
      summary: Xem tài khoản hiện tại
      operationId: auth_6_get
      x-implementation: existing
      x-roles: CUSTOMER|STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    patch:
      tags:
      - Auth
      summary: Cập nhật họ tên/số điện thoại
      operationId: auth_7_patch
      x-implementation: planned
      x-roles: CUSTOMER|STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
  /api/users/staff:
    get:
      tags:
      - Auth
      summary: Danh sách nhân viên
      operationId: auth_8_get
      x-implementation: planned
      x-roles: MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
    post:
      tags:
      - Auth
      summary: Quản lý tạo tài khoản lễ tân
      operationId: auth_9_post
      x-implementation: existing
      x-roles: MANAGER
      responses:
        '201':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
  /api/users/{id}/status:
    patch:
      tags:
      - Auth
      summary: Khóa/mở tài khoản
      operationId: auth_10_patch
      x-implementation: planned
      x-roles: MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: &id001
          type: string
          example: 11111111-1111-4111-8111-111111111111
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountStatusInput'
  /api/restaurants/current:
    get:
      tags:
      - Operations
      summary: Thông tin nhà hàng công khai
      operationId: operations_11_get
      x-implementation: planned
      x-roles: PUBLIC
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/restaurants/current/areas:
    get:
      tags:
      - Operations
      summary: Danh sách khu vực công khai
      operationId: operations_12_get
      x-implementation: planned
      x-roles: PUBLIC
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaArray'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /api/slots:
    get:
      tags:
      - Operations
      summary: Danh sách ca phục vụ theo ngày
      operationId: operations_13_get
      x-implementation: planned
      x-roles: PUBLIC
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotArray'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
  /api/availability:
    get:
      tags:
      - Operations
      summary: Tra cứu bàn có khả năng đáp ứng (không giữ bàn)
      operationId: operations_14_get
      x-implementation: planned
      x-roles: PUBLIC
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      parameters:
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: slotCode
        in: query
        required: true
        schema:
          type: string
      - name: partySize
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
  /api/bookings:
    post:
      tags:
      - Booking
      summary: Tạo yêu cầu đặt bàn bất đồng bộ, cần Idempotency-Key
      operationId: booking_15_post
      x-implementation: existing
      x-roles: CUSTOMER|STAFF|MANAGER
      responses:
        '202':
          description: Chỉ tiếp nhận bất đồng bộ, KHÔNG đồng nghĩa xác nhận đặt bàn hoặc hủy thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingReceipt'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 128
        description: Một key / một payload / một customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingInput'
  /api/bookings/mine:
    get:
      tags:
      - Booking
      summary: Liệt kê đặt bàn của tài khoản hiện tại
      operationId: booking_16_get
      x-implementation: existing
      x-roles: CUSTOMER|STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingList'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
  /api/bookings/{id}:
    get:
      tags:
      - Booking
      summary: Chi tiết đặt bàn, kiểm tra ownership
      operationId: booking_17_get
      x-implementation: existing
      x-roles: CUSTOMER|STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/bookings/{id}/cancellation-requests:
    post:
      tags:
      - Booking
      summary: Gửi yêu cầu hủy, chưa hủy ngay
      operationId: booking_18_post
      x-implementation: existing
      x-roles: CUSTOMER|STAFF|MANAGER
      responses:
        '202':
          description: Chỉ tiếp nhận bất đồng bộ, KHÔNG đồng nghĩa xác nhận đặt bàn hoặc hủy thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationReceipt'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelInput'
  /api/bookings/commands/{commandId}:
    get:
      tags:
      - Booking
      summary: Xem kết quả xử lý yêu cầu hủy
      operationId: booking_19_get
      x-implementation: existing
      x-roles: CUSTOMER|STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationCommand'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: commandId
        in: path
        required: true
        schema: *id001
  /api/operations/reservations:
    get:
      tags:
      - Operations
      summary: Danh sách điều phối, lọc state/date/slotId
      operationId: operations_20_get
      x-implementation: existing
      x-roles: STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationList'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: slotId
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
  /api/operations/reservations/{id}:
    get:
      tags:
      - Operations
      summary: Chi tiết đặt bàn cho nhân viên
      operationId: operations_21_get
      x-implementation: planned
      x-roles: STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
  /api/operations/reservations/{id}/{action}:
    post:
      tags:
      - Operations
      summary: 'Chuyển trạng thái: confirm/reject/check-in/seat/complete/no-show/cancel'
      operationId: operations_22_post
      x-implementation: existing
      x-roles: STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResult'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: action
        in: path
        required: true
        schema:
          type: string
          example: confirm
          enum:
          - confirm
          - reject
          - check-in
          - seat
          - complete
          - no-show
          - cancel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionInput'
      description: Phải kiểm tra expectedVersion; confirm bắt buộc tableId; reject/cancel cần reason; guards thời gian
        chưa có trong starter.
  /api/operations/tables:
    get:
      tags:
      - Operations
      summary: Danh sách bàn có trạng thái hoạt động
      operationId: operations_23_get
      x-implementation: existing
      x-roles: STAFF|MANAGER
      responses:
        '200':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableArray'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
    post:
      tags:
      - Operations
      summary: Tạo bàn
      operationId: operations_24_post
      x-implementation: existing
      x-roles: MANAGER
      responses:
        '201':
          description: Thành công; xem schema phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          description: Dữ liệu sai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột trạng thái/trùng bàn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
